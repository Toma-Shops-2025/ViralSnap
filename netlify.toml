[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  # Nitro inlines server env into functions; omit known keys so secrets scan does not fail the build.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_PUBLISHABLE_KEY,SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_PROJECT_ID,SUPABASE_PROJECT_ID,SUPABASE_SERVICE_ROLE_KEY,VITE_PAYMENTS_CLIENT_TOKEN,STRIPE_ENV,STRIPE_SECRET_KEY,STRIPE_SECRET_KEY_LIVE,STRIPE_SECRET_KEY_TEST,STRIPE_LIVE_API_KEY,STRIPE_SANDBOX_API_KEY,PUBLIC_APP_URL,GEMINI_API_KEY,PAYMENTS_LIVE_WEBHOOK_SECRET,PAYMENTS_TEST_WEBHOOK_SECRET,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,R2_PUBLIC_URL,MEDIA_RESTORE_SECRET,MODERATION_SECRET"

# Do NOT add a catch-all SPA redirect — TanStack Start SSR handles routing via Netlify Functions.
